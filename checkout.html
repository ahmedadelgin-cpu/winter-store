<!DOCTYPE html>
<html lang="ar" dir="rtl" id="checkoutRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب والدفع الآمن | CASHMERE Checkout</title>
    <style>
        :root {
            --bg-primary: #FAF8F5;
            --bg-card: #FFFFFF;
            --bg-secondary: #F3EFEA;
            --bg-accent: #EAE3D9;
            --primary: #947150;
            --primary-dark: #6D5135;
            --primary-light: #CBB49E;
            --text-dark: #27221E;
            --text-muted: #6E6760;
            --border-color: #E8E2D9;
            --accent-green: #3F8A65;
            --radius-md: 12px;
            --shadow-sm: 0 2px 8px rgba(39, 34, 30, 0.05);
            --transition: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Cairo", Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* شريط علوي */
        .checkout-header {
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary-dark);
            text-decoration: none;
        }
        .header-actions-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-to-store-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--primary-dark);
            font-size: 0.88rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .back-to-store-btn:hover {
            background: var(--primary);
            color: #fff;
        }
        .security-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--accent-green);
            font-weight: 600;
            background: #EDF7F2;
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* الحاوية الرئيسية */
        .checkout-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 32px;
        }

        .checkout-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-sm);
        }
        .section-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-dark);
        }

        /* شبكة الحقول */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group.full {
            grid-column: span 2;
        }
        .form-label {
            font-size: 0.86rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        .form-input {
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }
        .form-input:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(148, 113, 80, 0.12);
        }

        /* خيارات الدفع */
        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .payment-option {
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 18px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .payment-option:hover {
            border-color: var(--primary-light);
            background-color: var(--bg-secondary);
        }
        .payment-option.active {
            border-color: var(--primary);
            background-color: #FAF5EE;
        }
        .option-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .option-radio {
            accent-color: var(--primary-dark);
            width: 18px;
            height: 18px;
        }
        .payment-logos {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* حقول البطاقة البنكية */
        .card-details-box {
            background-color: var(--bg-primary);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ملخص الطلب */
        .order-summary-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
            position: sticky;
            top: 85px;
            box-shadow: var(--shadow-sm);
        }
        .order-items {
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .order-item {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .order-item-img {
            width: 55px;
            height: 65px;
            border-radius: 6px;
            object-fit: cover;
            background: var(--bg-secondary);
        }
        .order-item-info {
            flex-grow: 1;
        }
        .order-item-name {
            font-size: 0.86rem;
            font-weight: 700;
            line-height: 1.3;
        }
        .order-item-meta {
            font-size: 0.76rem;
            color: var(--text-muted);
        }
        .order-item-price {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--primary-dark);
        }

        .coupon-box {
            display: flex;
            gap: 8px;
            margin: 16px 0;
        }
        .coupon-btn {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 0 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .coupon-btn:hover {
            background-color: var(--primary);
            color: #fff;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .summary-row.total {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-dark);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: 12px;
        }

        .pay-now-btn {
            width: 100%;
            background-color: var(--primary-dark);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 16px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .pay-now-btn:hover {
            background-color: #553D26;
            box-shadow: 0 4px 16px rgba(109, 81, 53, 0.3);
        }

        @media (max-width: 860px) {
            .checkout-container { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <header class="checkout-header">
        <div class="header-content">
            <a href="index.html" class="brand-logo">CASHMERE</a>
            
            <div class="header-actions-box">
                <a href="index.html" class="back-to-store-btn" id="btnBackToStore">
                    <span>← العودة لمتجر الملابس الشتوية</span>
                </a>
                
                <div class="security-badge" id="badgeSecure">
                    🔒 اتصال مشفر وآمن 256-bit SSL
                </div>
            </div>
        </div>
    </header>

    <main class="checkout-container">
        <!-- 1. بيانات الشحن والدفع -->
        <div>
            <!-- بيانات الشحن والتوصيل -->
            <div class="checkout-card">
                <h2 class="section-title" id="titleShipping">📦 1. بيانات الشحن والتوصيل</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" id="lblFname">الاسم الأول *</label>
                        <input type="text" id="inpFname" class="form-input" placeholder="محمد" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="lblLname">اسم العائلة *</label>
                        <input type="text" id="inpLname" class="form-input" placeholder="أحمد" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="lblPhone">رقم الجوال *</label>
                        <input type="tel" id="inpPhone" class="form-input" placeholder="01XXXXXXXXX" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="lblEmail">البريد الإلكتروني *</label>
                        <input type="email" id="inpEmail" class="form-input" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="lblCity">المحافظة / المدينة *</label>
                        <input type="text" id="inpCity" class="form-input" placeholder="القاهرة / الجيزة / الإسكندرية" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="lblDistrict">المنطقة / الحي السكني *</label>
                        <input type="text" id="inpDistrict" class="form-input" placeholder="اسم الحي أو المنطقة" required>
                    </div>
                    <div class="form-group full">
                        <label class="form-label" id="lblAddress">العنوان بالتفصيل (اسم الشارع، رقم المبنى، رقم الشقة)</label>
                        <input type="text" id="inpAddress" class="form-input" placeholder="تفاصيل إضافية لتسهيل وصول المندوب">
                    </div>
                </div>
            </div>

            <!-- وسيلة الدفع -->
            <div class="checkout-card">
                <h2 class="section-title" id="titlePayment">💳 2. اختيار طريقة الدفع الإلكتروني</h2>
                <div class="payment-options">
                    
                    <!-- بطاقة بنكية -->
                    <label class="payment-option active" id="optCard">
                        <div class="option-left">
                            <input type="radio" name="payment" value="بطاقة بنكية (Visa/Mastercard)" class="option-radio" checked onchange="switchPayment('card')">
                            <div>
                                <strong id="txtCardTitle">بطاقة ائتمان / ميزة / فيزا وماستركارد</strong>
                                <p id="txtCardSub" style="font-size:0.78rem; color:var(--text-muted);">دفع فوري آمن ومحمي</p>
                            </div>
                        </div>
                        <span class="payment-logos">💳 Visa • Meeza • MC</span>
                    </label>

                    <!-- تفاصيل البطاقة -->
                    <div class="card-details-box" id="cardDetailsBox">
                        <div class="form-group">
                            <label class="form-label" id="lblCardNum">رقم البطاقة (16 رقم)</label>
                            <input type="text" id="inpCardNumber" class="form-input" placeholder="XXXX XXXX XXXX XXXX" maxlength="19">
                        </div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                            <div class="form-group">
                                <label class="form-label" id="lblCardExp">تاريخ الانتهاء</label>
                                <input type="text" class="form-input" placeholder="MM/YY" maxlength="5">
                            </div>
                            <div class="form-group">
                                <label class="form-label" id="lblCardCvv">رمز الأمان (CVV)</label>
                                <input type="password" class="form-input" placeholder="3 أرقام" maxlength="3">
                            </div>
                        </div>
                    </div>

                    <!-- أبل باي والمحافظ -->
                    <label class="payment-option" id="optApple">
                        <div class="option-left">
                            <input type="radio" name="payment" value="محفظة إلكترونية (فودافون كاش / Apple Pay)" class="option-radio" onchange="switchPayment('apple')">
                            <div>
                                <strong id="txtAppleTitle">المحافظ الإلكترونية (فودافون كاش / أبل باي / إنستاباي)</strong>
                                <p id="txtAppleSub" style="font-size:0.78rem; color:var(--text-muted);">دفع سريع وآمن</p>
                            </div>
                        </div>
                        <span class="payment-logos">📱 Wallets / Pay</span>
                    </label>

                    <!-- الدفع عند الاستلام -->
                    <label class="payment-option" id="optCod">
                        <div class="option-left">
                            <input type="radio" name="payment" value="الدفع عند الاستلام (COD)" class="option-radio" onchange="switchPayment('cod')">
                            <div>
                                <strong id="txtCodTitle">الدفع نقداً عند الاستلام (COD)</strong>
                                <p id="txtCodSub" style="font-size:0.78rem; color:var(--text-muted);">ادفع لمندوب التوصيل عند استلام الشحنة</p>
                            </div>
                        </div>
                        <span class="payment-logos" id="txtCodLogo">💵 نقدي</span>
                    </label>

                </div>
            </div>
        </div>

        <!-- 2. ملخص الطلب -->
        <aside>
            <div class="order-summary-card">
                <h3 id="txtSummaryTitle" style="font-size: 1.15rem; font-weight:800; margin-bottom:14px; color:var(--primary-dark);">ملخص طلبك</h3>
                
                <div class="order-items" id="summaryItems">
                    <!-- سيتم ملؤها بالسلة الحقيقية من المتجر -->
                </div>

                <div class="coupon-box">
                    <input type="text" class="form-input" id="couponCode" placeholder="كود الخصم (جرب: WINTER10)" style="flex:1;">
                    <button class="coupon-btn" id="btnApplyCoupon" onclick="applyCoupon()">تطبيق</button>
                </div>

                <div class="summary-row">
                    <span id="lblSubtotal">المجموع الفرعي:</span>
                    <span id="subTotalTxt">0.00 ج.م</span>
                </div>
                <div class="summary-row" id="discountRow" style="display:none; color:var(--accent-green);">
                    <span id="lblDiscount">الخصم المطبق (10%):</span>
                    <span id="discountTxt">-0.00 ج.م</span>
                </div>
                <div class="summary-row">
                    <span id="lblShippingMethod">الشحن السريع:</span>
                    <span id="lblFreeShipping" style="color:var(--accent-green); font-weight:700;">مجاني</span>
                </div>
                <div class="summary-row total">
                    <span id="lblFinalTotal">المبلغ الإجمالي للدفع:</span>
                    <span id="totalTxt">0.00 ج.م</span>
                </div>

                <button class="pay-now-btn" id="btnPayNow" onclick="confirmPayment()">
                    🔒 تأكيد الطلب والدفع الآن
                </button>
            </div>
        </aside>
    </main>

    <script>
        // قراءة اللغة من الصفحة الرئيسية
        const savedLang = localStorage.getItem("preferred_lang") || localStorage.getItem("checkout_lang") || "ar";
        const isAr = savedLang === "ar";
        const currency = "ج.م";

        let currentSubtotal = 0;
        let finalPayAmount = 0;
        let cartItems = [];

        // قراءة مشتريات السلة المخزنة من المتجر الرئيسي
        const savedCart = localStorage.getItem("winter_cart") || localStorage.getItem("checkout_cart");

        if (savedCart) {
            try {
                cartItems = JSON.parse(savedCart);
                if (cartItems && cartItems.length > 0) {
                    const itemsContainer = document.getElementById("summaryItems");
                    itemsContainer.innerHTML = cartItems.map(item => {
                        const totalItem = item.price * item.qty;
                        currentSubtotal += totalItem;
                        const name = isAr ? (item.name_ar || item.name) : (item.name_en || item.name);
                        const qtyText = isAr ? `المقاس: ${item.size} | الكمية: ${item.qty}` : `Size: ${item.size} | Qty: ${item.qty}`;
                        return `
                        <div class="order-item">
                            <img src="${item.img}" class="order-item-img" onerror="this.src='https://placehold.co/100x120/EDE7DF/6D5135?text=CASHMERE';">
                            <div class="order-item-info">
                                <h4 class="order-item-name">${name}</h4>
                                <span class="order-item-meta">${qtyText}</span>
                            </div>
                            <span class="order-item-price">${totalItem} ${currency}</span>
                        </div>
                        `;
                    }).join('');

                    finalPayAmount = currentSubtotal;
                    document.getElementById("subTotalTxt").textContent = currentSubtotal.toFixed(2) + " " + currency;
                    document.getElementById("totalTxt").textContent = finalPayAmount.toFixed(2) + " " + currency;
                } else {
                    document.getElementById("summaryItems").innerHTML = `<p style="color:var(--text-muted); font-size:0.9rem;">السلة فارغة حالياً.</p>`;
                }
            } catch(e) { console.error(e); }
        } else {
            document.getElementById("summaryItems").innerHTML = `<p style="color:var(--text-muted); font-size:0.9rem;">السلة فارغة. يرجى اختيار منتجات من المتجر أولاً.</p>`;
        }

        function switchPayment(type) {
            document.querySelectorAll(".payment-option").forEach(el => el.classList.remove("active"));
            const cardBox = document.getElementById("cardDetailsBox");

            if (type === 'card') {
                document.getElementById("optCard").classList.add("active");
                cardBox.style.display = "flex";
            } else {
                cardBox.style.display = "none";
                if (type === 'apple') document.getElementById("optApple").classList.add("active");
                if (type === 'cod') document.getElementById("optCod").classList.add("active");
            }
        }

        function applyCoupon() {
            const code = document.getElementById("couponCode").value.trim().toUpperCase();
            if (code === "WINTER10") {
                const discount = currentSubtotal * 0.10;
                finalPayAmount = currentSubtotal - discount;
                document.getElementById("discountRow").style.display = "flex";
                document.getElementById("discountTxt").textContent = `-${discount.toFixed(2)} ${currency}`;
                document.getElementById("totalTxt").textContent = `${finalPayAmount.toFixed(2)} ${currency}`;
                alert("تهانينا! تم تطبيق كود الخصم 10% بنجاح.");
            } else {
                alert("كود الخصم غير صحيح. جرب كود: WINTER10");
            }
        }

        // دالة تأكيد الطلب والربط مع صفحة orders.html
        function confirmPayment() {
            if (!cartItems || cartItems.length === 0) {
                alert("سلة الشراء فارغة! لا يمكن إتمام الطلب.");
                return;
            }

            const fname = document.getElementById("inpFname").value.trim();
            const lname = document.getElementById("inpLname").value.trim();
            const phone = document.getElementById("inpPhone").value.trim();
            const email = document.getElementById("inpEmail").value.trim();
            const city = document.getElementById("inpCity").value.trim();
            const district = document.getElementById("inpDistrict").value.trim();
            const address = document.getElementById("inpAddress").value.trim();

            if (!fname || !phone || !city) {
                alert("يرجى إدخال الاسم، رقم الجوال، والمدينة/المحافظة على الأقل لإتمام الطلب.");
                return;
            }

            // معرفة وسيلة الدفع المختارة
            const selectedPaymentRadio = document.querySelector('input[name="payment"]:checked');
            const paymentMethod = selectedPaymentRadio ? selectedPaymentRadio.value : "بطاقة بنكية";

            // إنشاء كائن الطلب الكامل
            const orderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);
            const newOrder = {
                id: orderId,
                date: new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                customer: {
                    fullName: `${fname} ${lname}`.trim(),
                    phone: phone,
                    email: email || "غير محدد",
                    city: city,
                    district: district,
                    address: address || "لم يتم تحديد تفاصيل إضافية"
                },
                paymentMethod: paymentMethod,
                items: cartItems,
                subTotal: currentSubtotal.toFixed(2) + " " + currency,
                total: finalPayAmount.toFixed(2) + " " + currency,
                status: "جديد (بانتظار الشحن)"
            };

            // حفظ الطلب في مصفوفة كل الطلبات (store_all_orders)
            const existingOrders = JSON.parse(localStorage.getItem("store_all_orders") || "[]");
            existingOrders.unshift(newOrder); // وضع الطلب الجديد في المقدمة
            localStorage.setItem("store_all_orders", JSON.stringify(existingOrders));

            // تفريغ السلة بعد إرسال الطلب
            localStorage.removeItem("winter_cart");
            localStorage.removeItem("checkout_cart");

            alert(`✅ شكراً لك يا ${fname}!\nتم استلام طلبك رقم (${orderId}) بنجاح.\nسيتم نقلك الآن لصفحة استقبال ومتابعة الطلبات.`);

            // التحويل لصفحة استقبال الطلبات
            window.location.href = "orders.html";
        }
    </script>
</body>
</html>
